# Local production-like run, and a reference for Coolify:
#   cp .env.example .env   # fill in SESSION_SECRET, SITE_URL and the USOS keys
#   docker compose up --build
services:
  oopswhere:
    build: .
    image: oopswhere:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "4321:4321"
