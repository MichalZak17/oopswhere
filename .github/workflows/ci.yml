name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Smoke test the production server
        run: |
          node server.mjs &
          pid=$!
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4321/api/health && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:4321/api/health
          # Graceful shutdown: SIGTERM must end the process promptly with exit code 0.
          kill -TERM "$pid"
          wait "$pid"
        env:
          HOST: 127.0.0.1
          PORT: 4321
          SESSION_SECRET: ci-only-secret-0123456789abcdefghijklmnopqrstuv

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image (what Coolify deploys)
        run: docker build -t oopswhere:ci .
      - name: Run it until the health check passes
        run: |
          docker run -d --name ow -p 4321:4321 \
            -e SESSION_SECRET=ci-only-secret-0123456789abcdefghijklmnopqrstuv oopswhere:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4321/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:4321/api/health
          docker stop -t 10 ow
          test "$(docker inspect -f '{{.State.ExitCode}}' ow)" = 0

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
