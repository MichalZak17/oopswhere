name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build (Node / Docker target)
        run: npm run build:node
      - name: Smoke test the Node build
        run: |
          node dist/server/entry.mjs &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4321/api/health && exit 0; sleep 0.5; done
          exit 1
        env:
          HOST: 127.0.0.1
          PORT: 4321
          SESSION_SECRET: ci-only-secret-0123456789abcdefghijklmnopqrstuv
      - name: Build (Vercel target)
        run: npx astro build
        env:
          DEPLOY_TARGET: vercel

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
